<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: auto;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: radial-gradient(circle, #0b456b, #021c37);
      }
      .clock {
        width: 500px;
        height: 500px;
        position: relative;
        background: radial-gradient(circle, #0b456b, #021c37);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .clock::before {
        content: "";
        width: 525px;
        height: 525px;
        z-index: -1;
        position: absolute;
        border-radius: 50%;
        box-shadow: 0 0 15px 15px rgba(0, 0, 0, 0.2);
      }
      .num {
        transform: rotate(calc(30deg * var(--n)));
        position: absolute;
        text-align: center;
        color: rgb(148, 132, 204);
        inset: 20px;
        font-size: 30px;
      }
      .center {
        width: 25px;
        height: 25px;
        position: absolute;
        background-color: rgb(235, 228, 228);
        border-radius: 50%;
      }
      .hour,
      .minute,
      .second {
        position: absolute;
        transform-origin: bottom center;
        left: 50%;
        bottom: 50%;
        transform: translateX(-50%) rotate(calc(var(--rotate) * 1deg));
      }
      .hour {
        width: 12px;
        height: 130px;
        background-color: red;
      }
      .minute {
        width: 8px;
        height: 190px;
        background-color: green;
      }
      .second {
        width: 4px;
        height: 120px;
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <div class="clock">
      <div class="num" style="--n: 1"><b>1</b></div>
      <div class="num" style="--n: 2"><b>2</b></div>
      <div class="num" style="--n: 3"><b>3</b></div>
      <div class="num" style="--n: 4"><b>4</b></div>
      <div class="num" style="--n: 5"><b>5</b></div>
      <div class="num" style="--n: 6"><b>6</b></div>
      <div class="num" style="--n: 7"><b>7</b></div>
      <div class="num" style="--n: 8"><b>8</b></div>
      <div class="num" style="--n: 9"><b>9</b></div>
      <div class="num" style="--n: 10"><b>10</b></div>
      <div class="num" style="--n: 11"><b>11</b></div>
      <div class="num" style="--n: 12"><b>12</b></div>
      <div class="hour" id="hour"></div>
      <div class="minute" id="minute"></div>
      <div class="second" id="second"></div>
      <div class="center"></div>
    </div>
    <script>
      function clockTime() {
        const data = new Date();
        const second = data.getSeconds();
        const minute = data.getMinutes();
        const hour = data.getHours();

        const secondRotation = second * 6;
        const minuteRotation = (minute + second / 60) * 6;
        const hourRotation = ((hour % 12) + minute / 60) * 30;
        document
          .getElementById("second")
          .style.setProperty("--rotate", secondRotation);
        document
          .getElementById("minute")
          .style.setProperty("--rotate", minuteRotation);
        document
          .getElementById("hour")
          .style.setProperty("--rotate", hourRotation);
      }
      setInterval(clockTime, 1000);
    </script>
  </body>
</html>
